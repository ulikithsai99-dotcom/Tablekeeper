services:
  - type: web
    name: tablekeeper
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python stage-4/server.py
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PORT
        value: "10000"
